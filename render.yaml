services:
  - type: web
    name: vault-storage-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: STORAGE_ROOT
        value: /tmp/storage
      - key: CORS_ORIGINS
        value: "*"
